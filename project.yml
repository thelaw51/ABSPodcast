name: ABSPodcastApp
options:
  bundleIdPrefix: com.thelaw51
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  developmentLanguage: en

configFiles:
  Debug: Config/Shared.xcconfig
  Release: Config/Shared.xcconfig

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete

targets:
  ABSPodcastApp:
    type: application
    platform: iOS
    sources:
      - Sources/ABSPodcastApp
      - Resources
    # Keys with no INFOPLIST_KEY_ build setting. Xcode merges this file with the generated keys.
    # Lives in Config/ because Resources/ is a source folder and would copy it twice.
    info:
      path: Config/Info.plist
      properties:
        UIBackgroundModes: [audio]
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1"
        # The SwiftLint phase reads every source file, which the script sandbox blocks.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: ABS Podcasts
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
    postBuildScripts:
      - name: SwiftLint
        basedOnDependencyAnalysis: false
        script: |
          if [ -x /opt/homebrew/bin/swiftlint ]; then
            /opt/homebrew/bin/swiftlint lint --quiet --config "${SRCROOT}/.swiftlint.yml" "${SRCROOT}/Sources"
          else
            echo "warning: SwiftLint not installed, run: brew install swiftlint"
          fi

  ABSPodcastAppTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests/ABSPodcastAppTests
    dependencies:
      - target: ABSPodcastApp
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

schemes:
  ABSPodcastApp:
    build:
      targets:
        ABSPodcastApp: all
        ABSPodcastAppTests: [test]
    test:
      targets:
        - ABSPodcastAppTests
